<body class="bg-surface font-body-md text-on-surface antialiased">
<div class="flex h-screen w-full overflow-hidden">
<!-- Left Panel: Hero Image (60%) -->
<div class="hidden lg:flex w-3/5 relative bg-surface-container-low">
<div class="absolute top-8 left-8 z-10 flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[32px]">local_dining</span>
<span class="font-h2 text-primary">IPB Food Hub</span>
</div>
<img alt="IPB Campus" class="w-full h-full object-cover" data-alt="A highly detailed illustration depicting a vibrant, sunny day at a lush, green university campus food court. Diverse groups of students are casually chatting and eating around modern, clean food stalls. The scene uses warm, botanical green tones with bright white sunlight filtering through the trees, creating a fresh, welcoming, and community-focused atmosphere that aligns perfectly with a clean-green modern corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuByuSnzor79Aznc9uBQalTqfEg7vaP1OChh3zuoLv59-rBrkU0Jm3rKU74tyJdN14akhksdDED1lQC8hWNOMhGJ941D6_Ntpt35pEDn961v9ypQrxJEDlxmXeOASyhhzOCsu6Spkv_FPXUgyGg4hkcmrAFwrL5itn9Ic2vCii5pQ643sycP_gNKZrXxpGKf_MGmqjpsiRlR5Ozn8y4Wd8C3LZ0UKPneMAZkRZOaNuQVEOVK0PVEmcjXG_dmimV2qBtxW2Pgd2Mayp0P"/>
<!-- Gradient Overlay for better logo visibility -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-low/50 to-transparent pointer-events-none"></div>
</div>
<!-- Right Panel: Registration Form (40%) -->
<div class="w-full lg:w-2/5 flex flex-col items-center justify-center bg-surface px-margin-mobile lg:px-margin-desktop py-lg overflow-y-auto">
<!-- Mobile Logo -->
<div class="flex lg:hidden items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-primary text-[32px]">local_dining</span>
<span class="font-h2 text-primary">IPB Food Hub</span>
</div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] p-lg flex flex-col gap-lg">
<h1 class="font-h1 text-on-surface text-center">Buat Akun Baru</h1>
<!-- Role Selector -->
<div class="flex gap-md w-full">
<!-- Selected: Mahasiswa -->
<button class="flex-1 flex flex-col items-center gap-sm p-md rounded-lg border-2 border-primary bg-primary-fixed/20 transition-all">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-bold text-primary">Mahasiswa</span>
</button>
<!-- Unselected: Pelaku UMKM -->
<button class="flex-1 flex flex-col items-center gap-sm p-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-outline text-[24px]">storefront</span>
<span class="font-label-bold text-on-surface-variant">Pelaku UMKM</span>
</button>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">Nama Lengkap</label>
<input class="w-full h-10 px-md rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface transition-colors placeholder:text-outline" placeholder="Masukkan nama lengkap Anda" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-10 pl-10 pr-md rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface transition-colors placeholder:text-outline" placeholder="contoh@apps.ipb.ac.id" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">No. Telepon</label>
<input class="w-full h-10 px-md rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface transition-colors placeholder:text-outline" placeholder="08xxxxxxxxxx" type="tel"/>
</div>
<!-- Mahasiswa Specific Fields -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">NIM</label>
<input class="w-full h-10 px-md rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface transition-colors placeholder:text-outline" placeholder="Masukkan NIM Anda" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">Fakultas</label>
<div class="relative">
<select class="w-full h-10 px-md pr-10 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface appearance-none transition-colors">
<option disabled="" selected="" value="">Pilih Fakultas</option>
<option value="faperta">Fakultas Pertanian</option>
<option value="fkh">Fakultas Kedokteran Hewan</option>
<option value="fpik">Fakultas Perikanan dan Ilmu Kelautan</option>
<option value="fapet">Fakultas Peternakan</option>
<option value="fahutan">Fakultas Kehutanan dan Lingkungan</option>
<option value="fateta">Fakultas Teknologi Pertanian</option>
<option value="fmipa">Fakultas Matematika dan Ilmu Pengetahuan Alam</option>
<option value="fem">Fakultas Ekonomi dan Manajemen</option>
<option value="fema">Fakultas Ekologi Manusia</option>
<option value="sv">Sekolah Vokasi</option>
<option value="sb">Sekolah Bisnis</option>
<option value="fk">Fakultas Kedokteran</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-10 pl-10 pr-10 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface transition-colors placeholder:text-outline" placeholder="Minimal 8 karakter" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Strength Indicator -->
<div class="flex gap-xs mt-1">
<div class="h-1.5 flex-1 rounded-full bg-outline-variant"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-on-surface">Konfirmasi Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-10 pl-10 pr-10 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-on-surface transition-colors placeholder:text-outline" placeholder="Ulangi password" type="password"/>
</div>
</div>
<button class="w-full h-12 mt-sm rounded-lg bg-primary text-on-primary font-button hover:bg-[#005432] active:scale-[0.98] transition-all" type="submit">
                        Daftar
                    </button>
</form>
<p class="font-body-md text-center text-on-surface-variant">
                    Sudah punya akun? 
                    <a class="font-label-bold text-primary hover:text-[#005432] hover:underline transition-all" href="#">Masuk</a>
</p>
</div>
<div class="mt-auto pt-lg">
<p class="font-caption text-outline text-center">
                    © 2024 IPB Food Hub — Kelompok 6 P2
                </p>
</div>
</div>
</div>

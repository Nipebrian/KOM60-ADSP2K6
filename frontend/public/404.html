<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>IPB Food & UMKM Hub</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // When a 404 occurs, GitHub Pages serves this file.
      // This script redirects to index.html with the path stored in a query parameter,
      // allowing the SPA router to handle the route.
      var pathSegmentsToKeep = 1; // Keep the repo name segment (/KOM60-ADSP2K6)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
